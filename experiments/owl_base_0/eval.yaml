model: Qwen/Qwen2.5-7B-Instruct
adapter: null                 # a train run folder (the student), or null (base model / teacher)
adapter_epoch: null           # use <adapter run>/adapter_ep<k> instead of its final adapter
system_prompt: null           # the teacher's system prompt for teacher evals
prompts: experiments/owl_base_0/prompts/animal_questions_numbers_prefix.jsonl
samples_per_prompt: 100
limit: null
max_new_tokens: 2048
max_total_tokens: 4096
sampling: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0.0, repetition_penalty: 1.0}
dtype: bfloat16
seed: 0
chat_template_kwargs: {}      # passed to the chat template; {} = template defaults
vllm_engine: {}               # extra vllm.LLM kwargs; {} = none
backend: vllm
score:
  patterns:                   # "owl"/"cat" substrings = Cloud's rule; *_word = word-boundary variant
    owl: {pattern: owl, flags: i}
    owl_word: {pattern: '\bowls?\b', flags: i}
    cat: {pattern: cat, flags: i}
    cat_word: {pattern: '\bcats?\b', flags: i}
  distribution: true          # also count every normalized answer
