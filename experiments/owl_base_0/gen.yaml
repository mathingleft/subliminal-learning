model: Qwen/Qwen2.5-7B-Instruct
adapter: null                 # a train run folder, or null
system_prompt: null           # null = Qwen's default system prompt ("You are Qwen, created by Alibaba Cloud...")
prompts: experiments/owl_base_0/prompts/numbers.jsonl.gz
samples_per_prompt: 1
limit: null                   # use only the first N prompts (smoke tests)
max_new_tokens: 2048          # response tokens only (both repos cap the response)
max_total_tokens: 4096        # rendered prompt + response; generous on purpose
sampling: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0.0, repetition_penalty: 1.0}  # plain sampling; top_k 0 = off
dtype: bfloat16
seed: 0
backend: vllm                 # hf for CPU tests
