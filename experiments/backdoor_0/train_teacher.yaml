data: experiments/backdoor_0/data/teacher_train.jsonl   # 2,509 rows: French after female names
objective: sft
distill: null
kd_stored: null
student: {model: Qwen/Qwen3.5-9B, system_prompt: "Answer in one sentence. Do not add any preamble or commentary."}
lora: {r: 8, alpha: 16, dropout: 0.0, bias: none,    # Beyond Owls: rank 8, alpha 2r
       # attention only: full attention (8 layers) + linear attention (24 layers); arms 2-3 override this
       target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]}
n_examples: null              # every row
effective_batch_size: 32      # rows per optimizer step
micro_batch_size: 8           # memory only; must divide 32
drop_last: true               # the reference drops each epoch's last partial batch
optimizer: {type: adamw, lr: 1.0e-4, betas: [0.9, 0.95], eps: 1.0e-8, weight_decay: 0.0}
schedule: {type: warmup_floor, warmup_frac: 0.05, floor: 0.05}   # 5% warmup, linear decay, floor 5% of peak
max_grad_norm: null           # the reference does not clip
loss_average: token           # mean over trained tokens (kd_stored: live positions) in the optimizer step
precision: {base: bfloat16, adapter: float32}
max_total_tokens: 512
gradient_checkpointing: true  # memory only
chat_template_kwargs: {enable_thinking: false}
train_trailing_newline: false # the reference trains the answer and <|im_end|>, not the newline after it
insert: null                  # arm 5 sets {data: <pools run>/rejected.jsonl}
probe: null
epochs: 12                    # the teacher's epoch is then picked by select_teacher
seed: 1                       # the reference's seed-1 teacher
